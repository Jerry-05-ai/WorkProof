# dataconnect/connector/mutations.gql
# All mutations used by the server models. Matches dataconnect/schema/schema.gql.

# ============ AUTH ============

mutation CreateUser(
  $email: String!
  $passwordHash: String!
  $fullName: String!
  $phone: String
  $role: String!
  $companyId: UUID
  $employeeRefId: UUID
) @auth(level: NO_ACCESS) {
  user_insert(
    data: {
      email: $email
      passwordHash: $passwordHash
      fullName: $fullName
      phone: $phone
      role: $role
      companyId: $companyId
      employeeRefId: $employeeRefId
      isActive: true
    }
  )
}

mutation UpdateUserLastLogin($id: UUID!) @auth(level: NO_ACCESS) {
  user_update(key: { id: $id }, data: { lastLogin_expr: "request.time" })
}

mutation SetUserCompanyAndEmployee($id: UUID!, $companyId: UUID, $employeeRefId: UUID) @auth(level: NO_ACCESS) {
  user_update(key: { id: $id }, data: { companyId: $companyId, employeeRefId: $employeeRefId })
}

mutation CreateCompany(
  $name: String!
  $email: String!
  $phone: String
  $website: String
  $industry: String
  $size: String
  $country: String
  $city: String
  $description: String
  $adminId: UUID
) @auth(level: NO_ACCESS) {
  company_insert(
    data: {
      name: $name
      email: $email
      phone: $phone
      website: $website
      industry: $industry
      size: $size
      country: $country
      city: $city
      description: $description
      adminId: $adminId
      status: "pending"
    }
  )
}

mutation SetCompanyAdmin($id: UUID!, $adminId: UUID!) @auth(level: NO_ACCESS) {
  company_update(key: { id: $id }, data: { adminId: $adminId })
}

mutation UpdateCompanyStatus($id: UUID!, $status: String!, $isVerified: Boolean!) @auth(level: NO_ACCESS) {
  company_update(key: { id: $id }, data: { status: $status, isVerified: $isVerified })
}

mutation CreateCompanyMembership(
  $userId: UUID!
  $companyId: UUID!
  $role: String!
  $invitedBy: UUID
) @auth(level: NO_ACCESS) {
  companyMembership_insert(
    data: {
      userId: $userId
      companyId: $companyId
      role: $role
      isActive: true
      invitedBy: { id: $invitedBy }
    }
  )
}

# ============ EMPLOYEE ============

mutation CreateEmployee(
  $userId: UUID
  $companyId: UUID!
  $firstName: String!
  $lastName: String!
  $email: String!
  $phone: String
  $jobTitle: String!
  $department: String!
  $employmentType: String
  $employmentStatus: String
  $startDate: Date!
  $endDate: Date
  $managerId: UUID
  $profilePhoto: String
  $location: String
) @auth(level: NO_ACCESS) {
  employee_insert(
    data: {
      userId: $userId
      companyId: $companyId
      firstName: $firstName
      lastName: $lastName
      email: $email
      phone: $phone
      jobTitle: $jobTitle
      department: $department
      employmentType: $employmentType
      employmentStatus: $employmentStatus
      startDate: $startDate
      endDate: $endDate
      managerId: $managerId
      profilePhoto: $profilePhoto
      location: $location
    }
  )
}

mutation UpdateEmployee(
  $id: UUID!
  $firstName: String
  $lastName: String
  $phone: String
  $jobTitle: String
  $department: String
  $employmentType: String
  $employmentStatus: String
  $startDate: Date
  $endDate: Date
  $managerId: UUID
  $profilePhoto: String
  $location: String
) @auth(level: NO_ACCESS) {
  employee_update(
    key: { id: $id }
    data: {
      firstName: $firstName
      lastName: $lastName
      phone: $phone
      jobTitle: $jobTitle
      department: $department
      employmentType: $employmentType
      employmentStatus: $employmentStatus
      startDate: $startDate
      endDate: $endDate
      managerId: $managerId
      profilePhoto: $profilePhoto
      location: $location
    }
  )
}

mutation SoftDeleteEmployee($id: UUID!) @auth(level: NO_ACCESS) {
  employee_update(key: { id: $id }, data: { deletedAt_expr: "request.time" })
}

mutation VerifyEmployeeRecord($id: UUID!, $verifiedBy: UUID!) @auth(level: NO_ACCESS) {
  employee_update(
    key: { id: $id }
    data: { isVerified: true, verifiedAt_expr: "request.time", verifiedById: $verifiedBy }
  )
}

mutation EndEmployeeEmployment($id: UUID!, $endDate: Date!) @auth(level: NO_ACCESS) {
  employee_update(
    key: { id: $id }
    data: { employmentStatus: "inactive", endDate: $endDate }
  )
}

# ============ SKILLS ============

mutation CreateSkill($name: String!, $category: String) @auth(level: NO_ACCESS) {
  skill_insert(data: { name: $name, category: $category })
}

mutation AddEmployeeSkill(
  $employeeId: UUID!
  $skillId: UUID!
  $proficiencyLevel: String!
  $initialLevel: String
  $yearsExperience: Float
) @auth(level: NO_ACCESS) {
  employeeSkill_insert(
    data: {
      employeeId: $employeeId
      skillId: $skillId
      proficiencyLevel: $proficiencyLevel
      initialLevel: $initialLevel
      lastAssessed_expr: "request.time"
      yearsExperience: $yearsExperience
    }
  )
}

mutation UpdateEmployeeSkill(
  $employeeId: UUID!
  $skillId: UUID!
  $proficiencyLevel: String
  $initialLevel: String
  $yearsExperience: Float
  $isVerified: Boolean
  $verifiedBy: UUID
  $verificationDate: Timestamp
) @auth(level: NO_ACCESS) {
  employeeSkill_update(
    key: { employeeId: $employeeId, skillId: $skillId }
    data: {
      proficiencyLevel: $proficiencyLevel
      initialLevel: $initialLevel
      yearsExperience: $yearsExperience
      isVerified: $isVerified
      verifiedBy: $verifiedBy
      verificationDate: $verificationDate
      lastAssessed_expr: "request.time"
    }
  )
}

