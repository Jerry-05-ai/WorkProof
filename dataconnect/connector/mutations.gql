# ============ MONTHLY REPORTS ============

mutation CreateMonthlyReport(
  $employeeId: UUID!
  $companyId: UUID!
  $month: String!
  $year: Int!
  $performanceScore: Float
  $behaviorScore: Float
  $skillsImproved: String
  $skillsNeedingDevelopment: String
  $projectsCompleted: Int
  $projectsInProgress: Int
  $goalsCompleted: Int
  $goalsPending: Int
  $growthPercentage: Float
  $promotionReadiness: Float
  $nextRole: String
  $isAiGenerated: Boolean
  $reportData: String
) @auth(level: NO_ACCESS) {
  monthlyProgressReport_insert(
    data: {
      employeeId: $employeeId
      companyId: $companyId
      month: $month
      year: $year
      performanceScore: $performanceScore
      behaviorScore: $behaviorScore
      skillsImproved: $skillsImproved
      skillsNeedingDevelopment: $skillsNeedingDevelopment
      projectsCompleted: $projectsCompleted
      projectsInProgress: $projectsInProgress
      goalsCompleted: $goalsCompleted
      goalsPending: $goalsPending
      growthPercentage: $growthPercentage
      promotionReadiness: $promotionReadiness
      nextRole: $nextRole
      isAiGenerated: $isAiGenerated
      reportData: $reportData
    }
  )
}

mutation UpdateMonthlyReport(
  $id: UUID!
  $performanceScore: Float
  $behaviorScore: Float
  $skillsImproved: String
  $skillsNeedingDevelopment: String
  $projectsCompleted: Int
  $projectsInProgress: Int
  $goalsCompleted: Int
  $goalsPending: Int
  $growthPercentage: Float
  $promotionReadiness: Float
  $nextRole: String
  $isAiGenerated: Boolean
  $reportData: String
) @auth(level: NO_ACCESS) {
  monthlyProgressReport_update(
    key: { id: $id }
    data: {
      performanceScore: $performanceScore
      behaviorScore: $behaviorScore
      skillsImproved: $skillsImproved
      skillsNeedingDevelopment: $skillsNeedingDevelopment
      projectsCompleted: $projectsCompleted
      projectsInProgress: $projectsInProgress
      goalsCompleted: $goalsCompleted
      goalsPending: $goalsPending
      growthPercentage: $growthPercentage
      promotionReadiness: $promotionReadiness
      nextRole: $nextRole
      isAiGenerated: $isAiGenerated
      reportData: $reportData
      generatedDate_expr: "request.time"
    }
  )
}

# ============ PRIVACY SETTINGS ============

mutation CreatePrivacySettings(
  $employeeId: UUID!
  $companyId: UUID!
  $profileVisibility: String
) @auth(level: NO_ACCESS) {
  privacySettings_insert(
    data: { employeeId: $employeeId, companyId: $companyId, profileVisibility: $profileVisibility }
  )
}

mutation UpdatePrivacySettings(
  $privacyId: UUID!
  $profileVisibility: String
  $namePublic: Boolean
  $photoPublic: Boolean
  $rolePublic: Boolean
  $skillsPublic: Boolean
  $skillLevelsPublic: Boolean
  $skillGrowthPublic: Boolean
  $projectsPublic: Boolean
  $projectDescriptionsPublic: Boolean
  $achievementsPublic: Boolean
  $experiencePublic: Boolean
  $performanceSummaryPublic: Boolean
  $monthlyProgressPublic: Boolean
  $behaviorSummaryPublic: Boolean
  $isEmployeeControlled: Boolean
  $ownershipTransferredAt: Timestamp
  $publishedAt: Timestamp
) @auth(level: NO_ACCESS) {
  privacySettings_update(
    key: { id: $privacyId }
    data: {
      profileVisibility: $profileVisibility
      namePublic: $namePublic
      photoPublic: $photoPublic
      rolePublic: $rolePublic
      skillsPublic: $skillsPublic
      skillLevelsPublic: $skillLevelsPublic
      skillGrowthPublic: $skillGrowthPublic
      projectsPublic: $projectsPublic
      projectDescriptionsPublic: $projectDescriptionsPublic
      achievementsPublic: $achievementsPublic
      experiencePublic: $experiencePublic
      performanceSummaryPublic: $performanceSummaryPublic
      monthlyProgressPublic: $monthlyProgressPublic
      behaviorSummaryPublic: $behaviorSummaryPublic
      isEmployeeControlled: $isEmployeeControlled
      ownershipTransferredAt: $ownershipTransferredAt
      publishedAt: $publishedAt
    }
  )
}

mutation TransferPrivacyOwnership($privacyId: UUID!) @auth(level: NO_ACCESS) {
  privacySettings_update(
    key: { id: $privacyId }
    data: { isEmployeeControlled: true, ownershipTransferredAt_expr: "request.time" }
  )
}

mutation MarkPrivacyPublished($privacyId: UUID!) @auth(level: NO_ACCESS) {
  privacySettings_update(
    key: { id: $privacyId }
    data: { publishedAt_expr: "request.time" }
  )
}

# ============ PUBLIC PROFILES ============

mutation CreatePublicProfile(
  $employeeId: UUID!
  $companyId: UUID!
  $slug: String!
) @auth(level: NO_ACCESS) {
  publicProfile_insert(
    data: { employeeId: $employeeId, companyId: $companyId, slug: $slug, isPublic: true }
  )
}

mutation UpdatePublicProfileVisibility($profileId: UUID!, $isPublic: Boolean!) @auth(level: NO_ACCESS) {
  publicProfile_update(key: { id: $profileId }, data: { isPublic: $isPublic })
}

mutation IncrementPublicProfileViews($profileId: UUID!, $viewCount: Int!) @auth(level: NO_ACCESS) {
  publicProfile_update(
    key: { id: $profileId }
    data: {
      viewCount: $viewCount
      lastViewedAt_expr: "request.time"
    }
  )
}

# ============ VERIFICATION CORRECTIONS ============

mutation CreateVerificationCorrection(
  $employeeId: UUID!
  $companyId: UUID!
  $fieldName: String!
  $oldValue: String
  $newValue: String
  $reason: String
  $requestedBy: UUID
) @auth(level: NO_ACCESS) {
  verificationCorrection_insert(
    data: {
      employeeId: $employeeId
      companyId: $companyId
      fieldName: $fieldName
      oldValue: $oldValue
      newValue: $newValue
      reason: $reason
      status: "pending"
      requestedById: $requestedBy
    }
  )
}

mutation UpdateVerificationCorrectionStatus($id: UUID!, $status: String!, $reviewedBy: UUID!) @auth(level: NO_ACCESS) {
  verificationCorrection_update(
    key: { id: $id }
    data: { status: $status, reviewedById: $reviewedBy }
  )
}

# ============ JOB OPPORTUNITIES ============

mutation CreateJobOpportunity(
  $recruiterId: UUID!
  $employeeId: UUID!
  $title: String!
  $companyName: String!
  $description: String
  $message: String
  $salaryRange: String
  $location: String
) @auth(level: NO_ACCESS) {
  jobOpportunity_insert(
    data: {
      recruiterId: $recruiterId
      employeeId: $employeeId
      title: $title
      companyName: $companyName
      description: $description
      message: $message
      salaryRange: $salaryRange
      location: $location
      status: "sent"
    }
  )
}

mutation UpdateJobOpportunityStatus($id: UUID!, $status: String!, $viewedAt: Timestamp, $respondedAt: Timestamp) @auth(level: NO_ACCESS) {
  jobOpportunity_update(
    key: { id: $id }
    data: { status: $status, viewedAt: $viewedAt, respondedAt: $respondedAt }
  )
}

# ============ EMPLOYMENT LINKS ============

mutation CreateEmploymentLink(
  $personEmail: String!
  $userId: UUID
  $employeeId: UUID!
  $companyId: UUID!
  $jobTitle: String
  $department: String
  $startedAt: Date
  $source: String
) @auth(level: NO_ACCESS) {
  employmentLink_insert(
    data: {
      personEmail: $personEmail
      userId: $userId
      employeeId: $employeeId
      companyId: $companyId
      jobTitle: $jobTitle
      department: $department
      startedAt: $startedAt
      isCurrent: true
      source: $source
    }
  )
}

mutation MarkEmploymentLinkLeft($linkId: UUID!, $leftAt: Date!) @auth(level: NO_ACCESS) {
  employmentLink_update(
    key: { id: $linkId }
    data: { leftAt: $leftAt, isCurrent: false }
  )
}

mutation AttachUserToEmploymentLinks($personEmail: String!, $userId: UUID!) @auth(level: NO_ACCESS) {
  employmentLink_updateMany(
    where: { personEmail: { eq: $personEmail } }
    data: { userId: $userId }
  )
}

# ============ NOTIFICATIONS ============

mutation CreateNotification(
  $userId: UUID!
  $type: String!
  $title: String!
  $message: String!
  $link: String
  $metadata: String
) @auth(level: NO_ACCESS) {
  notification_insert(
    data: { userId: $userId, type: $type, title: $title, message: $message, link: $link, metadata: $metadata }
  )
}

mutation MarkNotificationRead($id: UUID!) @auth(level: NO_ACCESS) {
  notification_update(
    key: { id: $id }
    data: { isRead: true, readAt_expr: "request.time" }
  )
}

mutation MarkAllNotificationsRead($userId: UUID!) @auth(level: NO_ACCESS) {
  notification_updateMany(
    where: { userId: { eq: $userId }, isRead: { eq: false } }
    data: { isRead: true, readAt_expr: "request.time" }
  )
}

