# ============ INVITATIONS ============

mutation CreateInvitation(
  $companyId: UUID!
  $email: String!
  $tokenHash: String!
  $firstName: String
  $lastName: String
  $jobTitle: String
  $department: String
  $invitedBy: UUID!
  $expiresAt: Timestamp!
) @auth(level: NO_ACCESS) {
  employeeInvitation_insert(
    data: {
      companyId: $companyId
      email: $email
      tokenHash: $tokenHash
      firstName: $firstName
      lastName: $lastName
      jobTitle: $jobTitle
      department: $department
      status: "pending"
      invitedById: $invitedBy
      expiresAt: $expiresAt
    }
  )
}

mutation MarkInvitationAccepted($id: UUID!) @auth(level: NO_ACCESS) {
  employeeInvitation_update(
    key: { id: $id }
    data: { status: "accepted", acceptedAt_expr: "request.time" }
  )
}

# ============ SAVED CANDIDATES ============

mutation SaveCandidate($recruiterId: UUID!, $employeeId: UUID!, $notes: String) @auth(level: NO_ACCESS) {
  savedCandidate_insert(
    data: { recruiterId: $recruiterId, employeeId: $employeeId, notes: $notes }
  )
}

mutation UpdateSavedCandidateNotes($recruiterId: UUID!, $employeeId: UUID!, $notes: String) @auth(level: NO_ACCESS) {
  savedCandidate_update(
    key: { recruiterId: $recruiterId, employeeId: $employeeId }
    data: { notes: $notes }
  )
}

mutation DeleteSavedCandidate($recruiterId: UUID!, $employeeId: UUID!) @auth(level: NO_ACCESS) {
  savedCandidate_delete(key: { recruiterId: $recruiterId, employeeId: $employeeId })
}
