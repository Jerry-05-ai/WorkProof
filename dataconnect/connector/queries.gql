query ListEmployeesByCompany(
  $companyId: UUID!
  $search: String
  $department: String
  $employmentStatus: String
  $isVerified: Boolean
  $limit: Int
  $offset: Int
) @auth(level: NO_ACCESS) {
  employees(
    where: {
      _and: [
        { companyId: { eq: $companyId } }
        { deletedAt: { isNull: true } }
        { department: { eq: $department } }
        { employmentStatus: { eq: $employmentStatus } }
        { isVerified: { eq: $isVerified } }
        {
          _and: [
            {
              _or: [
                { firstName: { contains: $search } }
                { lastName: { contains: $search } }
                { email: { contains: $search } }
              ]
            }
          ]
        }
      ]
    }
    orderBy: { createdAt: DESC }
    limit: $limit
    offset: $offset
  ) {
    id
    userId
    companyId
    firstName
    lastName
    email
    phone
    jobTitle
    department
    employmentType
    employmentStatus
    startDate
    endDate
    managerId
    profilePhoto
    location
    isVerified
    verifiedAt
    verifiedById
    createdAt
    updatedAt
    deletedAt
  }
}

query SearchEmployees($companyId: UUID!, $search: String!) @auth(level: NO_ACCESS) {
  employees(
    where: {
      _and: [
        { companyId: { eq: $companyId } }
        {
          _and: [
            {
              _or: [
                { firstName: { contains: $search } }
                { lastName: { contains: $search } }
                { email: { contains: $search } }
              ]
            }
          ]
        }
      ]
    }
    limit: 10
  ) {
    id
    email
    firstName
    lastName
  }
}

