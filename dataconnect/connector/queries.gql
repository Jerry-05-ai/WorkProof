# ============ AUDIT LOGS ============

query ListAuditLogs(
  $action: String
  $role: String
  $entityType: String
  $userId: UUID
  $dateFrom: Timestamp
  $dateTo: Timestamp
  $limit: Int
  $offset: Int
) @auth(level: NO_ACCESS) {
  auditLogs(
    where: {
      action: { eq: $action }
      role: { eq: $role }
      entityType: { eq: $entityType }
      userId: { eq: $userId }
      createdAt: { ge: $dateFrom, le: $dateTo }
    }
    orderBy: { createdAt: DESC }
    limit: $limit
    offset: $offset
  ) {
    id
    userId
    role
    action
    entityType
    entityId
    details
    ipAddress
    userAgent
    createdAt
    user {
      id
      fullName
      email
    }
  }
}

query CountAuditLogs(
  $action: String
  $role: String
  $entityType: String
  $userId: UUID
  $dateFrom: Timestamp
  $dateTo: Timestamp
) @auth(level: NO_ACCESS) {
  auditLogs(
    where: {
      action: { eq: $action }
      role: { eq: $role }
      entityType: { eq: $entityType }
      userId: { eq: $userId }
      createdAt: { ge: $dateFrom, le: $dateTo }
    }
  ) {
    id
  }
}

