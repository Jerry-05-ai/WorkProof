# dataconnect/connector/queries.gql
# All queries used by the server models. Matches dataconnect/schema/schema.gql.

# ============ AUTH ============

query GetUserByEmail($email: String!) @auth(level: NO_ACCESS) {
  users(where: { email: { eq: $email }, deletedAt: { isNull: true } }, limit: 1) {
    id
    email
    passwordHash
    fullName
    phone
    role
    isActive
    lastLogin
    createdAt
    updatedAt
    company {
      id
    }
    employeeRef {
      id
    }
  }
}

query GetUserById($id: UUID!) @auth(level: NO_ACCESS) {
  user(id: $id) {
    id
    email
    passwordHash
    fullName
    phone
    role
    isActive
    lastLogin
    createdAt
    updatedAt
    company {
      id
    }
    employeeRef {
      id
    }
  }
}

query GetCompanyById($id: UUID!) @auth(level: NO_ACCESS) {
